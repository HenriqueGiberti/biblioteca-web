spring.application.name=biblioteca-web
server.port=8080

# PostgreSQL (valores padrao para rodar local; o docker-compose sobrescreve via variaveis de ambiente)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/biblioteca_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
