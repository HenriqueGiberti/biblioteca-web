name: CI Biblioteca Web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Backend (Java 17 + Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Testes unitários e de integração (+ JaCoCo)
        run: mvn -B test
      - name: Relatório de cobertura (JaCoCo)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: backend/target/site/jacoco

  test-frontend:
    name: Frontend (Node 20 + React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false --passWithNoTests
      - run: npm run build

  # (extra) Docker Compose + testes de aceitação com curl
  acceptance:
    name: Docker + testes de aceitação
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Subir containers
        run: docker compose up -d --build
      - name: Aguardar a API
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/api/autores && exit 0
            sleep 5
          done
          docker compose logs
          exit 1
      - name: Criar autor e livro vinculado
        run: |
          AUTOR_ID=$(curl -sf -X POST http://localhost:8080/api/autores \
            -H 'Content-Type: application/json' \
            -d '{"nome":"Machado de Assis","nacionalidade":"Brasileira","dataNascimento":"1839-06-21"}' | jq -r .id)
          echo "Autor criado: $AUTOR_ID"
          curl -sf -X POST http://localhost:8080/api/livros \
            -H 'Content-Type: application/json' \
            -d "{\"titulo\":\"Dom Casmurro\",\"isbn\":\"978-8535910667\",\"anoPublicacao\":1899,\"genero\":\"Romance\",\"autor\":{\"id\":$AUTOR_ID}}"
          curl -f http://localhost:8080/api/livros
          curl -f http://localhost:3000
      - name: Derrubar containers
        if: always()
        run: docker compose down -v
